name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Install documentation dependencies
        run: python -m pip install -e ".[docs,ogata]"
      - name: Generate guided-example figures
        run: python docs/scripts/generate_figures.py examples
      - name: Generate guided-example runtime artifacts
        run: python docs/scripts/generate_example_artifacts.py
      - name: Check documentation artifacts
        run: python docs/scripts/check_artifacts.py

      - name: Build documentation
        run: python -m sphinx -W --keep-going -b html docs/source docs/_build/html
      - name: Check rendered documentation
        run: python docs/scripts/check_rendered_docs.py docs/_build/html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  deploy:
    name: Deploy documentation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
