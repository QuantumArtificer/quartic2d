name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Validate and build distributions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install release dependencies
        run: python -m pip install ".[test,docs,dev,release,ogata]"

      - name: Verify release metadata
        run: python tools/check_release_metadata.py --tag "${GITHUB_REF_NAME}"

      - name: Run tests
        run: python -m pytest -q

      - name: Run Ruff
        run: python -m ruff check src tests examples benchmarks docs/scripts tools

      - name: Run analytic validation
        run: python -m benchmarks.gaussian_validation --quick --output /tmp/quartic2d-gaussian.json

      - name: Check documentation artifacts
        run: python docs/scripts/check_artifacts.py

      - name: Build documentation
        run: python -m sphinx -W --keep-going -b html docs/source docs/_build/html

      - name: Run examples
        env:
          MPLBACKEND: Agg
        run: |
          for example in examples/*.py; do
            echo "==> $example"
            python "$example"
          done

      - name: Build distributions
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Install built wheel
        run: python -m pip install --force-reinstall --no-deps dist/*.whl

      - name: Import installed package outside the checkout
        working-directory: /tmp
        run: python -c "import quartic2d; print(quartic2d.__version__); print(quartic2d.__all__)"

      - name: Upload verified distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/quartic2d/
    permissions:
      id-token: write

    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  github-release:
    name: Publish GitHub release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download published distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Write checksums
        run: sha256sum dist/* > SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/* SHA256SUMS \
            --verify-tag \
            --title "QUARTIC2D ${GITHUB_REF_NAME#v}" \
            --generate-notes
