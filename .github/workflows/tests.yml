name: tests

on:
  push:
  pull_request:

jobs:
  current-dependencies:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install QUARTIC2D and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run tests
        run: python -m pytest -v

  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install QUARTIC2D
        run: python -m pip install -e .
      - name: Analytic Gaussian validation
        run: python -m benchmarks.documentation.gaussian_validation --quick --output /tmp/quartic2d-gaussian.json

  oldest-supported-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install oldest supported dependencies
        run: >-
          python -m pip install
          numpy==1.23.5
          scipy==1.9.3
          matplotlib==3.6.3
          hankel==1.2.2
          petal2d==0.1.0
          pytest==8.3.5
      - name: Install QUARTIC2D without dependency resolution
        run: python -m pip install -e . --no-deps
      - name: Run tests
        run: python -m pytest -v

  distributions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install release dependencies
        run: python -m pip install ".[release]"
      - name: Build distributions
        run: python -m build
      - name: Check distributions
        run: python -m twine check dist/*
