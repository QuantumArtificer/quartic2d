[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "quartic2d"
dynamic = ["version"]
description = "Four-center interaction integrals for localized two-dimensional states."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
  { name = "Alex Santacruz" },
  { name = "2DQMAT Research @ IF-UNAM" }
]
keywords = [
  "four-center-integrals",
  "interaction-matrix-elements",
  "hankel-transform",
  "angular-harmonics",
  "two-dimensional-materials",
  "quantum-materials",
  "wannier-functions",
  "condensed-matter-physics"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Physics"
]
dependencies = [
  "numpy>=1.23",
  "scipy>=1.9",
  "matplotlib>=3.6",
  "petal2d>=0.1.0"
]

[project.optional-dependencies]
ogata = ["hankel>=1.2.2"]
# Compatibility alias retained for users of the pre-public Ogata backend.
experimental = ["hankel>=1.2.2"]
test = ["pytest>=8"]
dev = ["ruff>=0.15,<0.17"]
release = ["build>=1.2", "twine>=5"]
docs = [
  "sphinx>=7.4",
  "pydata-sphinx-theme>=0.15",
  "myst-parser>=3",
  "sphinx-copybutton>=0.5",
  "sphinx-design>=0.6",
  "sphinxcontrib-bibtex>=2.6"
]

[project.urls]
Homepage = "https://github.com/QuantumArtificer/quartic2d"
Documentation = "https://quantumartificer.github.io/quartic2d/"
Repository = "https://github.com/QuantumArtificer/quartic2d"
Issues = "https://github.com/QuantumArtificer/quartic2d/issues"
Changelog = "https://github.com/QuantumArtificer/quartic2d/blob/main/CHANGELOG.md"
Contributing = "https://github.com/QuantumArtificer/quartic2d/blob/main/CONTRIBUTING.md"

[tool.setuptools.dynamic]
version = { attr = "quartic2d._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["docs/_build"]

[tool.ruff.lint]
select = [
  "E9", "F", "I",
  "B023", "BLE001",
  "UP033", "UP035", "UP037",
  "C401", "C408",
  "PIE808",
  "RUF007", "RUF012", "RUF046", "RUF059",
  "EXE001", "PLR1736",
]

[tool.ruff.lint.isort]
known-first-party = ["benchmarks", "generate_evidence", "quartic2d"]
